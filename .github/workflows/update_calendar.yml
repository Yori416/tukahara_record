name: 自動更新 YouTube 行事曆

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: setup-python@v4
      with:
        python-version: '3.x'

    - name: 執行抓取腳本
      run: python fetch_youtube.py

    - name: 檢查是否有更新並推送到 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add events.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新 YouTube 行程" && git push)
